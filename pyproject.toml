[project]
name = "aelix-analytics"
version = "0.1.0"
description = "Agent-native analytics projects with durable context, metrics, evidence, and reports"
requires-python = ">=3.12"
dependencies = []

# The pack itself is not installed anywhere. This environment exists to test the kit with the same
# libraries an analysis project gets (see kit/template/pyproject.toml).
[dependency-groups]
dev = [
  "duckdb>=1.3,<2",
  "polars>=1.30,<2",
  "pyarrow>=17",
  "matplotlib>=3.9",
  "plotly>=6,<7",
  "pygments>=2.18",
  "markdown-it-py>=3",
  "pytest>=8",
  "ruff>=0.12",
  "jsonschema>=4,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["kit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Same convention as aelix-ai: long lines are allowed (the report is mostly HTML template text).
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["labkit"]
