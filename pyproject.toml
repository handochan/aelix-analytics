[project]
name = "aelix-analytics"
version = "0.22.0"
description = "Agent-native analytics projects with durable context, metrics, evidence, and reports"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# The GitHub handle only, no email (owner's decision of 2026-10-07, Issue #24); the manifest's
# `authors` names the same.
authors = [{ name = "handochan" }]
maintainers = [{ name = "handochan" }]
# The floor of what runs where this is installed: the `analytics` command, the aelix extension and the
# stdlib core it loads (ADR-0002 decision 2). Analysis runs in each project's own environment, which
# keeps >=3.12 (src/aelix_analytics/template/pyproject.toml, decision 3).
requires-python = ">=3.11"
dependencies = []

[project.scripts]
analytics = "aelix_analytics.cli:main"

[project.entry-points."aelix.extensions"]
aelix-analytics = "aelix_analytics.extension:setup"

# The distribution is one wheel, built from the checkout as it is (ADR-0004): src/aelix_analytics is
# the package, the checkout's extension/aelix_analytics.py becomes aelix_analytics/extension.py, and a copy
# of src/aelix_analytics becomes aelix_analytics/kit/aelix_analytics/, which makes aelix_analytics/kit/
# the runtime root: the one directory a child gets on PYTHONPATH (Issue #9). force-include walks the directory without
# .gitignore (only __pycache__ is left out), so build from a clean checkout; the tests check the
# members. Pinned so a build does not drift with the backend.
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/aelix_analytics"]

[tool.hatch.build.targets.wheel.sources]
"src/aelix_analytics" = "aelix_analytics"

[tool.hatch.build.targets.wheel.force-include]
"extension/aelix_analytics.py" = "aelix_analytics/extension.py"
"src/aelix_analytics" = "aelix_analytics/kit/aelix_analytics"

[tool.hatch.build.targets.sdist]
only-include = ["src/aelix_analytics", "extension/aelix_analytics.py", "README.md", "pyproject.toml"]

# This environment tests the kit with the same libraries an analysis project gets (see
# src/aelix_analytics/template/pyproject.toml), so it needs what those need: >=3.12. The project itself is
# not installed into it; the tests build and install the wheel where they need it.
[dependency-groups]
dev = [
  "duckdb>=1.3,<2",
  "polars>=1.30,<2",
  "pyarrow>=17",
  "matplotlib>=3.9",
  "plotly>=6,<7",
  "pygments>=2.18",
  "markdown-it-py>=3",
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff>=0.12",
  "jsonschema[format-nongpl]>=4,<5",
]

[tool.uv]
package = false

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.12" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Same convention as aelix-ai: long lines are allowed (the report is mostly HTML template text).
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aelix_analytics"]
